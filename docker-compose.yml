name: sillage

services:
  db:
    image: postgres:18
    container_name: sillage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Only your own computer can connect. Not reachable from your network.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql (older versions used .../data).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: